# The desktop and its API, in one container. The listen port is substituted by
# the entrypoint so a host that already serves :80 can put Orion elsewhere.
server {
    listen __ORION_HTTP_PORT__ default_server;
    server_name _;

    root /var/www/orion;
    index index.html;

    # Uploads and downloads stream; the browser asks for a path, not a page.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://127.0.0.1:__ORION_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Whatever reverse proxy sits in front of this container decides who
        # the user is; it arrives as these headers, and none are invented here.
        # oauth2-proxy puts identity on the upstream request as X-Forwarded-*
        # (--pass-user-headers); X-Auth-Request-* is the response-only family it
        # sets for nginx's auth_request mode. Both are passed on so either kind
        # of front door works.
        proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Groups $http_x_forwarded_groups;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Groups $http_x_auth_request_groups;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Open on purpose (probes carry no session) and drawn by the API, which
    # answers 503 when the machine is not healthy.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:__ORION_PORT__/health;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
