# Orion — a landing page at / and the desktop SPA at /app/.
# The app routes on the hash, so only /app/ itself resolves to its shell;
# everything it needs under /assets/ keeps its fingerprinted, immutable paths.
#
# Only the edge proxy may reach this vhost: every sign-in is enforced there by
# oauth2-proxy in front of Authentik, and the API must not be a second, open
# door on the LAN. Incus exec / localhost is the break-glass path.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nas.innotel.us _;

    root /var/www/orion-landing;
    index index.html;
    charset utf-8;

    server_tokens off;
    client_max_body_size 2g;

    # The edge proxy, and nothing else. 127.0.0.1 is for incus exec and the
    # unit's own health check.
    allow 127.0.0.1;
    allow 192.168.1.71;
    deny all;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Uptime monitors probe this one path, so it stays open and carries no
    # data: the API draws the page and answers 503 when the machine is not
    # healthy, which is exactly what a probe should see.
    location = /health {
        allow all;
        access_log off;
        proxy_pass http://127.0.0.1:8099/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location = /app { return 301 /app/; }

    # The desktop shell. Hash routing means no other path under /app/ exists.
    # (`alias` to a file makes nginx append index.html to it, hence try_files.)
    location = /app/ {
        root /var/www;
        try_files /orion/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /app/ {
        alias /var/www/orion/;
        try_files $uri =404;
    }

    location /assets/ {
        alias /var/www/orion/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        alias /var/www/orion/favicon.svg;
        add_header Cache-Control "public, max-age=86400";
    }

    # The real machine, from orion-api.service. Uploads stream straight through.
    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Groups $http_x_auth_request_groups;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
