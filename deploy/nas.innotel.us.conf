# Orion — a landing page at / and the desktop SPA at /app/.
# The app routes on the hash, so only /app/ itself resolves to its shell;
# everything it needs under /assets/ keeps its fingerprinted, immutable paths.
#
# Only the edge may reach this vhost: the API must not be a second, open door on
# the LAN. Two ways in, one identity each:
#
#   nas.innotel.us  oauth2-proxy in front of Authentik, which forwards the
#                   address it authenticated in a header;
#   orion.locker    straight here, where orion-api runs the OIDC flow itself and
#                   keeps its own session. The edge proxy's CSRF cookie had to
#                   survive a redirect through the provider to sign anyone in,
#                   and a browser that would not keep it could not sign in at
#                   all; the app's flow needs no such cookie.
#
# Incus exec / localhost is the break-glass path.
# Which page the front door shows. orion.locker is public and opens on access:
# sign in, or get access through Magnate. nas.innotel.us stays the page for
# people who run the container themselves.
map $host $orion_home {
    orion.locker /locker.html;
    default      /index.html;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nas.innotel.us _;

    root /var/www/orion-landing;
    index index.html;
    charset utf-8;

    server_tokens off;
    # Keep `return` targets relative: the edge terminates TLS, so nginx would
    # otherwise answer with http:// and the browser would bounce through a
    # second plaintext redirect.
    absolute_redirect off;
    client_max_body_size 2g;

    # The edge proxy, and nothing else. 127.0.0.1 is for incus exec and the
    # unit's own health check.
    allow 127.0.0.1;
    allow 192.168.1.71;
    deny all;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Uptime monitors probe this one path, so it stays open and carries no
    # data: the API draws the page and answers 503 when the machine is not
    # healthy, which is exactly what a probe should see.
    location = /health {
        allow all;
        access_log off;
        proxy_pass http://127.0.0.1:8099/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location = /app { return 301 /app/; }

    # What Orion sells, and the sizes it will actually create. The page reads
    # the same catalogue the provisioner reads (`/api/plans`), so a price or a
    # size is never changed in two places.
    location = /subscribe {
        try_files /subscribe.html =404;
        add_header Cache-Control "no-cache";
    }

    # The front door itself. Which page it is depends on the name asked for:
    # orion.locker is the public access page, nas.innotel.us the StorageOps one.
    # The desktop is a path (/app/), so a visitor is never dropped into a locked
    # shell before they have decided to sign in.
    location = / {
        add_header Cache-Control "no-cache";
        try_files $orion_home =404;
    }

    # The desktop shell. Hash routing means no other path under /app/ exists.
    # (`alias` to a file makes nginx append index.html to it, hence try_files.)
    location = /app/ {
        root /var/www;
        try_files /orion/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /app/ {
        alias /var/www/orion/;
        try_files $uri =404;
    }

    location /assets/ {
        alias /var/www/orion/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        alias /var/www/orion/favicon.svg;
        add_header Cache-Control "public, max-age=86400";
    }

    # Signing in, served by the API. The state of a login in flight lives in
    # that process, so nothing has to be round-tripped in a cookie.
    location /auth/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # The real machine, from orion-api.service. Uploads stream straight through.
    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Identity, as the edge proxy adds it to the upstream request. The
        # proxy's --pass-user-headers sends X-Forwarded-*; X-Auth-Request-* is a
        # response-only family, which is why the desktop once showed no session
        # while the proxy log named the address. Send both, from the request
        # only: this vhost accepts nothing but the proxy host and localhost, and
        # the proxy strips client-supplied copies before setting its own.
        proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;
        proxy_set_header X-Forwarded-Groups $http_x_forwarded_groups;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Groups $http_x_auth_request_groups;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $orion_home;
    }
}
