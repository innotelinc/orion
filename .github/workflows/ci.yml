name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are noise; pushes are left alone so a long build
# is never cancelled halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The desktop is served from the nas container by nginx in front of
# orion-api.py, so what CI can prove from here is that the bundle typechecks and
# builds. The API's role rules are unit-tested against a temporary data root;
# the rest of its behaviour is covered by scripts/smoke-dom.mjs, which needs a
# running orion-api and the container's real payloads.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Who may administer whom is the one part of the API that is pure logic, so it
  # is tested here rather than only on the box: every test builds a throwaway
  # /srv/storage in a temp directory.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Role rules
        run: python3 -m unittest discover -s server/tests -v
