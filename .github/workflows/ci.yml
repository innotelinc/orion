name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are noise; pushes are left alone so a long build
# is never cancelled halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The desktop is served from the nas container by nginx in front of
# orion-api.py, so what CI can prove from here is that the bundle typechecks,
# builds and renders — and, in a real browser, that nothing at the bottom of a
# page is left unclickable behind the narrow navigation bar. The API's role rules are unit-tested against a temporary
# data root; the pages are rendered headlessly by scripts/smoke-dom.mjs against
# the committed payloads in scripts/fixtures, so a view that throws on render
# fails this workflow instead of the box.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Every route, and every Settings tab, rendered in jsdom against
      # scripts/fixtures. A crash there is a blank page in production, so it
      # fails here. `dist/` is the build from the step above.
      - name: Render
        run: npm run test:dom

      # A bar that floats over the page can hide the last control in a pane, and
      # jsdom lays nothing out, so this one needs a real browser. The runner's
      # Chrome is used when it is there; otherwise the matching Chromium is
      # installed, which is the only download this job needs.
      - name: Browser for the layout check
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "layout check: using the runner's Google Chrome"
          else
            version=$(node -p "require('playwright-core/package.json').version")
            npx --yes "playwright@$version" install --with-deps chromium
          fi

      - name: Layout
        run: npm run test:layout

  # Who may administer whom is the one part of the API that is pure logic, so it
  # is tested here rather than only on the box: every test builds a throwaway
  # /srv/storage in a temp directory.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Role rules
        run: python3 -m unittest discover -s server/tests -v
