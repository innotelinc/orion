name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are noise; pushes are left alone so a Pages
# deployment is never cancelled halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag orion:ci .

      - name: Serve a mounted array and probe it
        run: |
          # A real directory on the runner stands in for the user's pool: the
          # point of this job is that the image reports on what it is given,
          # not that it can render a hard-coded dataset.
          mkdir -p /tmp/array/Photos
          echo "real bytes" > /tmp/array/Photos/lake.jpg

          docker run --detach --name orion --publish 8080:8080 \
            --env ORION_ROOTS=/data \
            --volume /tmp/array:/data:ro orion:ci
          for attempt in $(seq 1 20); do
            curl --silent --fail --output /tmp/index.html http://127.0.0.1:8080/ && break
            sleep 1
          done

          grep --quiet '<div id="root"></div>' /tmp/index.html
          asset=$(grep --only-matching '/assets/[^"]*\.js' /tmp/index.html | head -1)
          curl --silent --fail --output /dev/null --write-out "asset %{http_code}\n" "http://127.0.0.1:8080${asset}"
          curl --silent --fail --output /dev/null --write-out "spa fallback %{http_code}\n" http://127.0.0.1:8080/files

          curl --silent --fail --output /tmp/health.json http://127.0.0.1:8080/api/health
          curl --silent --fail --output /tmp/files.json "http://127.0.0.1:8080/api/files?path=/"
          curl --silent --fail --output /tmp/system.json http://127.0.0.1:8080/api/system
          cat /tmp/health.json /tmp/files.json /tmp/system.json

          # The mounted directory is what the API reports, named after the mount.
          grep --quiet '"name":"data"' /tmp/files.json
          # The system sample is the container's own, not the demo fixture.
          grep --quiet '"hostname"' /tmp/system.json
          ! grep --quiet '"hostname":"orion-node"' /tmp/system.json

          # A write is refused by construction, not by UI discipline.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8080/api/files)
          test "$code" = "405"

          docker logs orion
          docker rm --force orion

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
